<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- The picture shown when the editor is linked to: its name on the left, and on the right a map
       of four by four tiles drawn as the editor draws one. Rendered by art/render.mjs, in Outfit. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="checkpoint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="0.5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fff1f2"/><rect width="5" height="12" fill="#fda4af"/>
    </pattern>
    <g id="mark"><circle r="22" fill="#fff"/><circle r="18"/></g>
  </defs>

  <rect width="1200" height="630" fill="#eef2f7"/>

  <g transform="translate(88 148)">
    <svg width="88" height="88" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2563eb"/>
      <rect x="11" y="11" width="42" height="42" rx="3" fill="#fff"/>
      <rect x="32" y="11" width="21" height="21" fill="#bfdbfe"/>
      <path d="M32 11.5V53M11.5 32H53" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M32 11V32H42" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="square"/>
      <path d="M11 34A19 19 0 0 1 30 53" fill="none" stroke="#0f172a" stroke-width="4"/>
      <rect x="11" y="11" width="42" height="42" rx="3" fill="none" stroke="#0f172a" stroke-width="5"/>
      <circle cx="42.5" cy="42.5" r="5.5" fill="#ea580c"/>
      <circle cx="42.5" cy="42.5" r="2.2" fill="#fff"/>
    </svg>
  </g>
  <g font-family="Outfit" fill="#0f172a">
    <text x="84" y="330" font-size="68" font-weight="800" letter-spacing="-1">Erebus</text>
    <text x="84" y="406" font-size="68" font-weight="800" letter-spacing="-1">World Editor</text>
    <text x="88" y="466" font-size="25" font-weight="400" fill="#475569">Draw a map of RoboCupJunior Rescue Simulation</text>
    <text x="88" y="504" font-size="25" font-weight="400" fill="#475569">and export it as a world, by each year's rules</text>
  </g>

  <g transform="translate(722 115)" filter="url(#shadow)">
    <rect x="-24" y="-24" width="448" height="448" rx="20" fill="#fff"/>
  </g>
  <g transform="translate(722 115)">
    <!-- tiles of 100: rooms, then the coloured tiles, the grid, the walls and the victims -->
    <rect width="400" height="400" fill="#fff"/>
    <rect x="200" y="0" width="200" height="200" fill="#dbeafe"/>
    <rect x="200" y="200" width="200" height="200" fill="#fae8ff"/>
    <path d="M300 300H400V400H300Z" fill="url(#hatch)"/>
    <rect x="100" y="100" width="100" height="100" fill="#111827"/>
    <rect x="0" y="200" width="100" height="100" fill="#cd853f"/>
    <rect x="100" y="300" width="100" height="100" fill="url(#checkpoint)"/>
    <rect x="200" y="100" width="100" height="100" fill="#4f46e5"/>
    <path d="M100 0V400M200 0V400M300 0V400M0 100H400M0 200H400M0 300H400" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="12" y="312" width="76" height="76" fill="none" stroke="#16a34a" stroke-width="8"/>
    <g fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="square">
      <path d="M200 5V195M200 255V395"/>
      <path d="M205 200H245M305 200H395"/>
      <path d="M300 395A95 95 0 0 1 395 300" stroke-linecap="butt"/>
      <path d="M300 205V250A50 50 0 0 0 250 300"/>
    </g>
    <rect width="400" height="400" fill="none" stroke="#0f172a" stroke-width="14" stroke-linejoin="round"/>
    <g font-family="Outfit" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <g transform="translate(50 42)"><use href="#mark" fill="#ea580c"/><text y="8">H</text></g>
      <g transform="translate(358 50)"><use href="#mark" fill="#2563eb"/><text y="8">S</text></g>
      <g transform="translate(150 250)"><use href="#mark" fill="#16a34a"/><text y="8">U</text></g>
      <g transform="translate(350 250)"><use href="#mark" fill="#dc2626"/><circle r="11" fill="none" stroke="#fff" stroke-width="3"/><circle r="4" fill="#fff"/></g>
    </g>
  </g>
</svg>
